server:
  port: 8080

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: false
            maxAge: 3600
  webflux:
    webjars-path-pattern: /webjars/**

app:
  security:
    jwt:
      secret: ${JWT_SECRET:SuperSecretKeyForJWTTokenSigningSuperSecretKeyForJWTTokenSigning}
      public-key: ${JWT_RSA_PUBLIC_KEY:}
  rate-limiter:
    auth-replenish-rate: 5
    auth-burst-capacity: 5
    default-replenish-rate: 20
    default-burst-capacity: 40

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    path: /swagger-ui.html
    urls:
      - name: 1. Identity Service (Auth & Security)
        url: /v3/api-docs/identity-service
      - name: 2. Master Service (Reference Data)
        url: /v3/api-docs/master-service
      - name: 3. User Service (Donors & Staff)
        url: /v3/api-docs/user-service
      - name: 4. Hospital Service (Hospitals)
        url: /v3/api-docs/hospital-service
      - name: 5. Blood Bank Service (Inventory)
        url: /v3/api-docs/blood-bank-service
      - name: 6. Donation Service (Donation Records)
        url: /v3/api-docs/donation-service
      - name: 7. Transaction Service (Requests & Issuance)
        url: /v3/api-docs/transaction-service
      - name: 8. Notification Service (Templates & Logs)
        url: /v3/api-docs/notification-service
