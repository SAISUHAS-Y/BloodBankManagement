services:
  # -------------------------------------------------------------
  # 1. Databases & Message Brokers
  # -------------------------------------------------------------

  # MySQL 9.x Database Container
  mysql-db:
    image: mysql:9.0.0
    container_name: mysql-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "saisuhas@421"
      # Initialize databases for microservices
      MYSQL_DATABASE: bloodbank
    volumes:
      - mysql-data:/var/lib/mysql
      # Script to initialize multiple databases (user, donor, inventory, notification)
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psaisuhas@421"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis 8.x Cache Container (Used for rate limiting and session storage)
  redis-cache:
    image: redis:8.0-M03-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # RabbitMQ 4.x Broker Container (Used for async inter-service communication)
  rabbitmq-broker:
    image: rabbitmq:4.0-management-alpine
    container_name: rabbitmq-broker
    ports:
      - "5672:5672"
      - "15672:15672" # Management Dashboard
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zipkin Distributed Tracing Server Container (Port 9411)
  zipkin-tracing:
    image: openzipkin/zipkin:3
    container_name: zipkin-tracing
    ports:
      - "9411:9411"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. Infrastructure Microservices
  # -------------------------------------------------------------

  # Config Server (Port 8888)
  config-server:
    image: eclipse-temurin:25-jre-alpine
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: "false"
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:///app/config-repo
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx256m -XX:MaxMetaspaceSize=192m -XX:+UseG1GC"
    volumes:
      - ./infrastructure/config-server/target/config-server-1.0.0-SNAPSHOT.jar:/app/config-server.jar
      - ./infrastructure/config-server/src/main/resources/shared-configs:/app/config-repo
    command: java -jar /app/config-server.jar
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Discovery Server / Eureka (Port 8761)
  discovery-server:
    image: eclipse-temurin:25-jre-alpine
    container_name: discovery-server
    ports:
      - "8761:8761"
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: "false"
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx256m -XX:MaxMetaspaceSize=192m -XX:+UseG1GC"
    volumes:
      - ./infrastructure/discovery-server/target/discovery-server-1.0.0-SNAPSHOT.jar:/app/discovery-server.jar
    command: java -jar /app/discovery-server.jar
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # API Gateway (Port 8080)
  api-gateway:
    image: eclipse-temurin:25-jre-alpine
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_HOST: discovery-server
      EUREKA_USERNAME: admin
      EUREKA_PASSWORD: admin123
      REDIS_HOST: redis-cache
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: "false"
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx256m -XX:MaxMetaspaceSize=192m -XX:+UseG1GC"
    volumes:
      - ./infrastructure/api-gateway/target/api-gateway-1.0.0-SNAPSHOT.jar:/app/api-gateway.jar
    command: java -jar /app/api-gateway.jar
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # -------------------------------------------------------------
  # 3. Business Microservices
  # -------------------------------------------------------------
  # Business microservices communicate internally within the Docker bridge network.
  # External entry point is exclusively routed through API Gateway (port 8080).
  # -------------------------------------------------------------

  # Identity Service (Internal Port: 8081)
  identity-service:
