server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/identity_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

app:
  security:
    jwt:
      secret: ${JWT_SECRET:SuperSecretKeyForJWTTokenSigningSuperSecretKeyForJWTTokenSigning}
      private-key: ${JWT_RSA_PRIVATE_KEY:}
      public-key: ${JWT_RSA_PUBLIC_KEY:}

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha
