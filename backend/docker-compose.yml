      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: "false"
      MYSQL_HOST: mysql-db
      REDIS_HOST: redis-cache
      RABBITMQ_HOST: rabbitmq-broker
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx224m -XX:MaxMetaspaceSize=192m -XX:+UseG1GC -XX:+UseStringDeduplication"
    volumes:
      - ./services/identity-service/target/identity-service-1.0.0-SNAPSHOT.jar:/app/identity-service.jar
    command: java -jar /app/identity-service.jar
    depends_on:
      mysql-db:
        condition: service_healthy
      rabbitmq-broker:
        condition: service_healthy
      config-server:
        condition: service_healthy
